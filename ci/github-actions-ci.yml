name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      # ttucs depends on the weights package; install the local (weightless) copy so pip does not
      # need PyPI for it. Tests that need real weights skip when they are absent.
      - run: pip install -e packages/ttucs-model-bow -e ".[dev]"
      - run: ruff check src tests scripts
      - run: pytest -q
      - run: ttucs generate-data -c configs/smoke.yaml && ttucs train -c configs/smoke.yaml
      - name: Packaging smoke test
        run: python -m build --outdir dist . && twine check --strict dist/*

# Vocabulary banks for the synthetic description generator (ttucs.synth).
#
# The generator combines, per CatID:
#   * category-level `objects` (what is sounding) and `actions` (what it does),
#   * subcategory-level `subcategory_actions` for the material x action pattern UCS uses
#     (e.g. GLASS-BREAK, METAL-FRICTION, WOOD-TONAL),
#   * the UCS Explanation and the (distinctiveness-weighted) UCS Synonyms of the CatID,
#   * global `modifiers` and `contexts`.
# Written by hand from sound-library conventions (BOOM/PSE style FX names) - no library
# metadata is copied here.

modifiers:
  speed: [slow, fast, quick, very slow, medium speed, rapid]
  intensity: [soft, hard, gentle, heavy, light, loud, quiet, aggressive, subtle, violent, strong, weak]
  size: [small, large, big, tiny, huge, medium, massive, little]
  time: [short, long, single, multiple, repeated, intermittent, steady, constant, sporadic, continuous, rhythmic, sequence, series]
  character: [metallic, hollow, resonant, dull, bright, muffled, rattly, crisp, deep, high pitched, low, thin, thick, wet, dry, old, rusty, squeaky, creaky]

contexts:
  - in a small room
  - in a large hall
  - in the garage
  - outside
  - in the forest
  - on the street
  - in the kitchen
  - in a warehouse
  - in the backyard
  - in a parking lot
  - in the studio
  - in a stairwell
  - by the river
  - in the basement
  - with some wind
  - with distant traffic
  - with room reverb

subcategory_actions:
  BREAK: [break, breaking, snap, shatter, crack, smash, split]
  CRASH & DEBRIS: [crash, debris falling, crash and debris, collapse into pieces, rubble settle, pieces scatter]
  FRICTION: [scrape, rub, drag, grind, slide, screech, scratch, squeal]
  HANDLE: [handling, pick up, put down, set down, grab, fiddle, place on table]
  IMPACT: [impact, hit, drop, thud, bang, knock, slam, strike, tap, smack]
  MOVEMENT: [movement, rattle, shake, jostle, roll, shuffle, wobble, tumble]
  TONAL: [ring, resonance, tonal hit, bowed, singing tone, ringout, hum]
  CREAK: [creak, creaking, groan, strain, squeak]
  RIP: [rip, tear, ripping apart, shred]
  FLAP: [flap, flutter, snap in wind, wave]
  MISC: [sound, misc, various, assorted]
  DUST: [dust, puff of dust, sift, trickle, pour]
  SUCTION: [suction, suck, slurp, plunger pull, squelch]
  BUBBLES: [bubbles, bubbling, gurgle, blub, boil]


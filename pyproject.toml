[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ttucs"
dynamic = ["version"]
description = "Text to UCS: classify speech-to-text field-recording slates into Universal Category System CatIDs."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jon Evans" }]
requires-python = ">=3.10"
keywords = ["ucs", "universal category system", "sound effects", "metadata", "audio", "pytorch", "mlflow"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Inference only: no network at import/predict time. Weights come from the data-only
# `ttucs-model-bow` distribution (see packages/ttucs-model-bow and docs/RELEASING.md).
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "safetensors>=0.4",
    "platformdirs>=3",
    "ttucs-model-bow>=0.1.1,<0.2",
]

[project.optional-dependencies]
# training, evaluation, reports and MLflow tracking (`ttucs train|eval|report`)
train = ["scikit-learn>=1.3", "matplotlib>=3.7", "pandas>=2.0", "mlflow>=2.14"]
mlflow = ["mlflow>=2.14", "pandas>=2.0"]
transformers = ["sentence-transformers>=3.0"]
dev = ["ttucs[train]", "pytest>=8", "pytest-cov>=5", "ruff>=0.6", "pre-commit>=3.7", "openpyxl>=3.1",
       "build>=1.2", "twine>=6.1"]
all = ["ttucs[train,transformers]"]

[project.scripts]
ttucs = "ttucs.cli:main"

[project.urls]
Homepage = "https://github.com/SoundsLikeJonny/ttucs"
Documentation = "https://github.com/SoundsLikeJonny/ttucs#readme"
Issues = "https://github.com/SoundsLikeJonny/ttucs/issues"
"Model card" = "https://github.com/SoundsLikeJonny/ttucs/blob/main/MODEL_CARD.md"
Changelog = "https://github.com/SoundsLikeJonny/ttucs/blob/main/CHANGELOG.md"
UCS = "https://universalcategorysystem.com/"

[tool.setuptools.dynamic]
version = { attr = "ttucs._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ttucs.resources" = ["*.csv", "*.yaml"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S"]
ignore = ["S101", "S311", "RUF001", "RUF002", "RUF003", "B905", "SIM108", "SIM905", "RUF012", "B027"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"scripts/*" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["slow: trains a tiny model (deselect with -m 'not slow')"]
filterwarnings = ["ignore::DeprecationWarning"]
